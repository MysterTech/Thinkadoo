  - main [ref=e10]:
    - generic [ref=e26]:
      - heading [level=1] [ref=e27]:
        - strong [ref=e28]: Deine Kinderzahnärzte in Böblingen
      - heading [level=2] [ref=e29]:
        - strong [ref=e30]: Die Experten für kleine und große Zähne
      - paragraph [ref=e31]: Herzlich Willkommen in der KINDER Praxis & Klinik für Zahnheilkunde im Zentrum Böblingens. In unserer liebevoll und kindgerecht gestalteten Praxis stehen die kleinsten, kleinen und mittelgroßen Patientinnen und Patienten im Mittelpunkt. Unser langjährig erfahrenes Ärzteteam ist darauf spezialisiert, Kleinkinder und Teenager an angstfreie Besuche und damit positive Zahnarzt Erlebnisse heranzuführen.
      - paragraph [ref=e32]: Wir glauben daran, dass gesunde Zähne bei einem ebenso gesunden Verhältnis zum regelmäßigen Zahnarztbesuch beginnen. Deshalb setzt unser auf Kinderzahnheilkunde spezialisiertes Team auf eine gleichermaßen professionelle wie offene, einfühlsame und freundliche Kommunikation in kindgerechter Atmosphäre. Erfahren Sie mehr über unser zahnmedizinisches Leistungsspektrum, das Team vor Ort und die Behandlungsschwerpunkte in unserer KINDER Klinik und Praxis in Böblingen direkt neben Sindelfingen.
    - generic [ref=e52]:
      - generic [ref=e53]:
        - heading [level=2] [ref=e54]:
          - strong [ref=e55]: Unser zahnmedizinisches Leistungsspektrum für Kids & Teens
        - paragraph [ref=e56]: Kinder sind keine kleinen Erwachsenen, sie sehen die Welt mit anderen Augen – das gilt natürlich auch für zahnmedizinische Behandlungen. Unser Team, bestehend aus erfahrenen Kinderzahnärztinnen und Ärzten, Zahnarzthelferinnen und Helfern sowie Prophylaxe-Spezialistinnen und -Spezialisten, hat sich zum Ziel gesetzt, jedem Kind und Teenager die bestmögliche Betreuung zu bieten.
        - paragraph [ref=e57]: "Mit viel Geduld und Einfühlungsvermögen erklären wir unseren jungen Patientinnen und Patienten spielerisch die einzelnen Behandlungsschritte, beraten die begleitenden Eltern entsprechend und nehmen uns die Zeit, die es braucht, um auf die individuellen Persönlichkeiten einzugehen. Gemeinsam arbeiten wir in einer freundlichen Atmosphäre daran, den Kleinsten ab dem ersten Milchzahn das Größte zu bieten: eine unbeschwerte Zeit, ein gesundes Verhältnis zum Zahnarztbesuch und ein strahlend schönes Lachen!"
      - generic [ref=e59]:
        - generic [ref=e60]:
          - heading "Früh übt sich!" [level=3] [ref=e61]
          - paragraph [ref=e62]: Wir empfehlen den ersten Zahnarztbesuch ab dem ersten Zahn. Neben dem gegenseitigen Kennenlernen und dem Aufbau eines vertrauensvollen Verhältnisses zwischen unserem Ärzteteam und den kleinen Patienten geht es vor allem um das Erkennen erster Risikofaktoren. Die Beratung der Eltern sowie das Herantasten an einen spielerischen Umgang mit der eigenen Zahnhygiene werden durch dieses behutsame und kindgerechte Vorgehen unterstützt. Sodass eine Zahnarztangst im besten Fall erst gar nicht aufkommt.
        - generic [ref=e63]:
          - heading "Kinderprophylaxe" [level=3] [ref=e64]
          - paragraph [ref=e65]: Die gesetzliche Krankenkasse übernimmt bei Kindern ab 6 Jahren zwei Mal im Jahr eine professionelle Zahnreinigung - schon gewusst? Gemeinsam mit den Kindern üben wir spielerisch Zahnputztechniken und tasten uns an das Thema Mundhygiene heran. Der frühe Start dieser zahnmedizinischen Prophylaxe Behandlungen in unserer Praxis hilft Kindern und Teenagern dabei, einen routinierten Umgang mit der Ergänzung der häuslichen Zahnpflege zu etablieren.
        - generic [ref=e66]:
          - heading "Kariesbehandlungen & Füllungen" [level=3] [ref=e67]
          - paragraph [ref=e68]: Schmerzfrei und schonend – so behandeln wir die kariösen Zähne von Kindern und Jugendlichen, denen entsprechend geholfen werden muss. Dabei kommen modernste Füllungsmaterialien wie zahnfarbene Kunststoffkeramikfüllungen und individuelle Behandlungskonzepte zum Einsatz, die die individuelle Situation der Kinder berücksichtigen und auf sie eingehen.
        - generic [ref=e69]:
          - heading "Milchzahnkronen" [level=3] [ref=e70]
          - paragraph [ref=e71]: Sind Milchzähne extrem angegriffen, können Milchzahnkronen einen vorzeitigen Verlust verhindern. Milchzähne sind als Platzhalter für die bleibenden Zähne enorm wichtig und spielen eine große Rolle, was die anhaltende Zahngesundheit angeht. Sollte wegen starkem Kariesbefall ein Milchzahnverlust drohen, kümmern wir uns um die Überkronung der betroffenen Milchzähne und sorgen dank Lokalanästhetika auch hier für eine schmerzfreie Behandlung.
        - generic [ref=e72]:
          - heading "Vollnarkosen" [level=3] [ref=e73]
          - paragraph [ref=e74]: Haben Kinder und Jugendliche große Angst vor einer zahnchirurgischen Behandlung oder leiden sie unter starken, kariösen Entzündungen, bieten wir in unserer Praxis und Klinik die Option der Vollnarkose an. Unser erfahrenes Experten- und Anästhesieteam übernimmt dabei die Betreuung. Vor allem bei geistig oder körperlich behinderten, jungen Patienten hilft die beruhigende Atmosphäre und schmerzfreie Behandlung dank Narkose.
        - generic [ref=e75]:
          - heading "Zahnunfälle" [level=3] [ref=e76]
          - paragraph [ref=e77]: Kinder entdecken und rennen durch die Welt - dabei kann es schnell passieren – man stürzt und verletzt sich die Zähne. Am häufigsten sind dabei die vorderen Schneidezähne betroffen. Statistisch gesehen erleidet jedes dritte Kind bis zur Vollendung des 16. Lebensjahres einen Zahnunfall. Nach einem Zahntrauma ist die adäquate Erstversorgung entscheidend für den späteren Heilungsprozess. Darum vergeben wir in solchen dringenden Fällen zeitnah Termine und betreuen Kinder und Teenager je nach Vorfall, Vorgeschichte und Möglichkeiten stets individuell und situativ.
        - generic [ref=e78] [cursor=pointer]
    - generic [ref=e99]:
      - generic [ref=e100]:
        - generic [ref=e102]:
          - heading [level=2] [ref=e103]:
            - strong [ref=e104]: "Ab den ersten Milchzähnen: unsere Praxis für Kleinkinder."
          - paragraph [ref=e105]: Die Untersuchungen und Behandlungen beginnen in dem Alter, in dem die Kleinsten bereits den ersten Milchzahn haben. Neben der Ernährungsberatung, die wir unseren kleinen Patientinnen und Patienten sowie den Eltern, gerne näher bringen, erklären wir auf kindgerechte Art und Weise, welche Lebensmittel gut für die Zahngesundheit sind und welche nicht. Wir sprechen über gesunde Alternativen, befassen uns spielerisch mit den täglichen Zahnhygieneroutinen und gestalten gemeinsam mit Ihnen als Eltern ein auf das Kind abgestimmtes Vorsorgeprogramm.
          - paragraph [ref=e106]: Zusammen nehmen wir den kleinsten Kindern so die Angst vor dem Zahnarztbesuch und beginnen im frühesten Alter damit, Vertrauen sowie einen gesunden Umgang mit dem Besuch in unserer Praxis aufzubauen. Neben der Ernährungsberatung, dem spielerischen Erlernen von effektiven Putztechniken und täglichen Zahnpflege bieten wir außerdem Schnullerberatungen an.
        - figure [ref=e109]:
          - img "Kleinkinder" [ref=e110]
      - generic [ref=e111]:
        - figure [ref=e114]:
          - img "Teenager" [ref=e115]
        - generic [ref=e117]:
          - heading [level=2] [ref=e118]:
            - strong [ref=e119]: Für Jugendliche und Zähne, die lange gesund bleiben.
          - paragraph [ref=e120]: Für Teenager und Jugendliche passen wir die Behandlungen entsprechend dem Alter an und setzen auf eine unbeschwerte Atmosphäre, in der man sich wohlfühlt. Dabei umfasst unser Behandlungsspektrum alle Aspekte der modernen Kinderzahnheilkunde, wie Kariesrisikobestimmung und Kariesfrüherkennung mittels moderner Diagnostikverfahren.
          - paragraph [ref=e121]: Dank modernsten therapeutischen Methoden und einem auf das Alter und Kariesrisiko der Teenager abgestimmtes Vorsorgeprogramm unterstützen wir unsere jugendlichen Patientinnen und Patienten dabei, einen gesunden und angstfreien Umgang mit dem Besuch beim Zahnarzt zu pflegen. Insbesondere Fissurenversiegelungen der bleiben Backenzähne, Beratung bei Kreidezähnen bzw. MIH Zähnen sowie die Beratung und Unterstützung bei der Zahnpflege mit festsitzenden Spangen spielt für diese Patientengruppe eine entscheidende Rolle.
    - generic [ref=e146]:
      - generic [ref=e147]:
        - heading [level=2] [ref=e148]:
          - strong [ref=e149]: Ein Ort, an dem Zahnheilkunde und gute Laune zusammenkommen.
        - paragraph [ref=e150]: "Betritt man unsere liebevoll gestalteten Praxisräume fällt eins schnell auf: im Fokus steht hier nicht nur ein Umfeld, in dem medizinische Behandlungen durchgeführt werden können, sondern im Mittelpunkt steht das Wohlbefinden der jungen Patientinnen und Patienten. Dafür haben wir Räume geschaffen, in denen fröhliche Farben und Formen für gute Laune sorgen und der Angst ab der ersten Minute direkt entgegenwirken. In unserer Praxis und Klinik im Zentrum Böblingens haben wir eine Atmosphäre geschaffen, in der Kinder und Jugendliche sich gut aufgehoben und vor allem verstanden fühlen. Bei der gesamten Gestaltung unserer Zahnarztpraxis und Klinik haben wir größten Wert darauf gelegt, dass der Zahnarztbesuch für Ihr Kind zu einem positiven Erlebnis wird."
      - generic [ref=e153]:
        - img "Kinderzahnärztin mit Spiegel" [ref=e155]

    - generic [ref=e178]:
      - generic [ref=e179]:
        - generic [ref=e180]: Eine Klinik, eine Praxis – noch mehr Expertise.
        - generic [ref=e181]:
          - img "Teambild" [ref=e183]
          - generic [ref=e184]:
            - heading "Großes Team für kleine Patientinnen und Patienten." [level=2] [ref=e185]
            - paragraph [ref=e186]: "Unser hochqualifiziertes und herzliches Team ist speziell für den Umgang mit Kindern und Jugendlichen ausgebildet. Um stets auf dem neuesten Stand der Kinderzahnheilkunde zu sein, setzen wir auf ein breit gefächertes Weiterentwicklungs- und Fortbildungsangebot, das unser Team regelmäßig und gerne wahrnimmt. Das Arbeitsklima in unserer Klinik und Praxis ist genauso angenehm, wir die liebevoll gestalteten Räume selbst. Ob als Kollegen untereinander, die Bindung zu den Ärztinnen und Ärtzen in unserem Haus oder der Umgang mit den jungen Patientinnen und Patienten und ihren Eltern: wir bauen auf einen respekt- und vertrauensvollen Umgang nach innen und außen. Klingt nach einem Arbeitsumfeld, nach dem Sie suchen? Wir freuen uns immer über motivierte Mitarbeitende und Initiativbewerbungen!"
      - generic [ref=e188]:
        - heading [level=3] [ref=e189]:
          - strong [ref=e190]: "Für Kinder und Erwachsene: unsere Praxis & Klinik für Zahnheilkunde in Böblingen!"
        - paragraph [ref=e191]: Neben der Kinderzahnheilkunde für junge Patientinnen und Patienten betreuen wir auch Erwachsene, die mund-, kiefer- oder gesichtschirurgische Behandlungen in Anspruch nehmen müssen. Als Fachärzte- und damit Spezialistenteam sind wir sowohl für Patientinnen und Patienten als auch für zuweisende zahnärztliche und ärztliche Kollegen die medizinisch kompetenten Ansprechpartner in den Bereichen Implantologie, Oralchirurgie und ästhetischer Gesichtschirurgie.
        - paragraph [ref=e192]: "Dank unterschiedlicher Schwerpunkte unserer Zahnärztinnen und Ärzte können wir jeden Patienten fachübergreifend beraten und behandeln: Von individuellen Behandlungsprogrammen über die Durchführung komplexer Behandlungsfälle bis hin zur Betreuung von Angstpatientinnen und Patienten. In den hochmodernen Räumen unserer Praxis- und Zahnarztklinik empfangen wir entsprechend nicht nur Kinder und Teenager, sondern gerne auch Erwachsene. Erfahren Sie mehr über unsere Klinik und Praxis für Zahnheilkunde in Böblingen direkt neben Sindelfingen und genau zwischen Stuttgart & Herrenberg!"
        - link "Mehr erfahren" [ref=e193] [cursor=pointer]:
          - /url: https://www.praxis-und-klinik.de
    - generic [ref=e195]:
      - heading "Fragen und Antworten" [level=2] [ref=e196]
      - generic [ref=e210]:
        - generic [ref=e211]:
          - button [expanded] [ref=e212]:
            - heading "Wann sollte ich mit meinem Kind das erste Mal zum Zahnarzt?" [level=3] [ref=e213]
          - paragraph [ref=e215]: Wir empfehlen die erste Untersuchung ab dem ersten Zahn. Der erste Milchzahn bricht in der Regel zwischen dem 6. und 8. Lebensmonat durch. Danach empfehlen wir viertel- bzw. halbjährliche Kontrolltermine. Was für die einen sehr früh klingt, dient vor allem einem gesunden Umgang mit dem Zahnarztbesuch, da die Kinder routiniert und frei von Angst damit aufwachsen. Sie als Eltern werden rund um alle Fragen aus den Bereichen Ernährung, Zahnpflege, Anwendung von Fluoriden, die Nutzung von Schnullern und Nuckelflaschen oder aber auch das Daumenlutschen beraten. So arbeiten wir von Anfang an gemeinsam an der Zahngesundheit Ihres Kindes.
        - generic [ref=e216]:
          - button [ref=e217]:
            - heading "Warum sollten ich mit meinem Kind extra in eine Kinderzahnarztpraxis?" [level=3] [ref=e218]
          - paragraph [ref=e220]: Kinder unterscheiden sich nicht nur in allgemeinmedizinischer, sondern auch in zahnmedizinischer Hinsicht wesentlich von Erwachsenen. Der Besuch beim Kinderzahnarzt sollte daher genauso selbstverständlich sein, wie der beim allgemeinmedizinischen Kinderarzt. Die zahnärztlichen Behandlungsmöglichkeiten sind bei jedem Kind so individuell wie die besonderen Bedürfnisse des Kindes. Damit Kinder und Jugendliche eine positives Behandlungserlebnis erfahren und zu angstfreien Erwachsenen werden, die sich beim Zahnarztbesuch wohlfühlen, empfiehlt sich der Besuch einer Kinderzahnarztpraxis und Klinik.
        - generic [ref=e221]:
          - button [ref=e222]:
            - heading "Darf ich auch ohne Überweisung einen Termin für mein Kind vereinbaren?" [level=3] [ref=e223]
          - paragraph [ref=e225]: Natürlich. Wir schauen uns in der Erstuntersuchung die kleinen Patientinnen und Patienten an und besprechen dann gemeinsam mit den Eltern das weitere Vorgehen. Ein verständnisvoller Umgang sowie transparenter Austausch auf Augenhöhe stehen dabei im Mittelpunkt.
        - generic [ref=e226]:
          - button [ref=e227]:
            - heading "Kann ich auch online einen Termin für mein Kind vereinbaren?" [level=3] [ref=e228]
          - paragraph [ref=e230]: Am besten rufen Sie für einen Ersttermin bei uns in der Praxis und Klinik an. Damit wir mögliche erste Rückfragen direkt mit Ihnen klären können. Ihr Kind ist bereits Patientin oder Patient bei uns und Sie möchten lediglich den nächsten Vorsorge- und Kontrolltermin vereinbaren? Dann nutzen Sie gerne unser Online Terminbuchungstool!
        - generic [ref=e231]:
          - button [ref=e232]:
            - heading "Müssen kariöse Milchzähne behandelt werden?" [level=3] [ref=e233]
          - paragraph [ref=e235]: "Je nachdem, welche Erkrankung vorliegt und mit welchen Schmerzen oder Problemen diese einhergeht, müssen auch Milchzähne behandelt werden. Gesunde Milchzähne sind wichtig für die Sprachentwicklung und eine entspannte Nahrungsaufnahme. Zudem dienen die Milchzähne als Platzhalter für die bleibenden Zähne, die folgen. Ein vorzeitiger Milchzahnverlust kann einen Platzmangel für die durchbrechenden zweiten Zähne zur Folge haben oder aber auch Zahnfehlstellungen und Entwicklungsstörungen des Kiefers verursachen. Unbehandelter Kariesbefall kann neben Schmerzen außerdem auch bei den durchbrechenden bleibenden Zähnen zu Karies führen. Daher gilt: bereits ab dem ersten Zahn geben wir alles, um die Zahngesundheit zu erhalten oder wiederherzustellen."
        - generic [ref=e236]:
          - button [ref=e237]:
            - heading "Wie komme ich am Besten zu euch?" [level=3] [ref=e238]
          - generic [ref=e239]:
            - paragraph [ref=e240]: Die Praxis & Klinik für Kiefer & Gesicht befindet sich im „CityCenter“ Böblingen, Wolfgang-Brumme-Allee 25, direkt neben dem Einkaufszentrum “Mercaden”. Für Patienten der Zahnklinik stehen in unserer Tiefgarage 27 kostenfreie Parkplätze zur Verfügung. Von der Tiefgarage erreichen Sie unsere Räumlichkeiten barrierefrei mit dem Aufzug.
            - paragraph [ref=e241]: "Der Bahnhof Böblingen mit den S-Bahnanschlüssen S1: Herrenberg - Stuttgart - Kirchheim(Teck), S60: Böblingen - Sindelfingen - Renningen - Stuttgart, der Schönbuchbahn Böblingen - Dettenhausen sowie der Busbahnhof sind ca. 200 m entfernt."
    - generic [ref=e244]:
      - heading [level=2] [ref=e245]:
        - strong [ref=e246]: "Für kleine, mittelgroße und große Zähne: Ihre Praxis & Klinik für Kinder und Erwachsene."
      - paragraph [ref=e247]: In unserer Praxis und Klinik für Kinderzahnmedizin arbeitet ein perfekt geschultes Team daran, den Zahnarztbesuch für Kinder und Jugendliche angstfrei zu gestalten. In unseren liebevoll und kindgerecht gestalteten Räumen empfangen fröhliche Farben und freundliche Gesichter die jungen Patientinnen und Patienten. Ziel unserer Arbeit ist es, gemeinsam mit Ihnen die optimale Mundgesundheit Ihrer Kinder sicherzustellen. Durch die langjährige Erfahrung unserer Zahnärztinnen und Zahnärzte beraten wir Sie ganzheitlich, kindgerecht und auf Augenhöhe. Ganz gleich, ob Kassen- oder Privatpatienten – wir machen keinen Unterschied und behandeln immer individuell, transparent und professionell. Dabei bieten wir ein umfassendes Spektrum an kinderzahnärztlichen Leistungen.
      - list [ref=e248]:
        - listitem [ref=e249]:
          - strong [ref=e250]: "Vorsorgeuntersuchungen:"
          - text: Regelmäßige Kontrollen, um Karies und andere Zahnprobleme frühzeitig zu erkennen, ihnen entgegenzuwirken und sie individuell sowie kindgerecht zu behandeln.
        - listitem [ref=e251]:
          - strong [ref=e252]: "Prophylaxe:"
          - text: Professionelle Zahnreinigung, Fluoridierung und Fissurenversiegelung zur Vorbeugung von Zahnerkrankungen.
        - listitem [ref=e253]:
          - strong [ref=e254]: "Zahnbehandlungen:"
          - text: Schonende Behandlungsmethoden für Füllungen, Milchzahnkronen und Wurzelkanalbehandlungen.
        - listitem [ref=e255]:
          - strong [ref=e256]: "Zahnfehlstellungen:"
          - text: Frühzeitige Erkennung und Behandlung von Zahnfehlstellungen in Zusammenarbeit mit Kieferorthopäden.
        - listitem [ref=e257]:
          - strong [ref=e258]: "Angstfreie Behandlungen:"
          - text: Anwendung von kindgerechten Beruhigungsmethoden sowie Durchführung von Behandlungen unter Vollnarkose.
      - paragraph [ref=e259]: Bei jeder Behandlung setzen wir dabei auf schonende und kindgerechte Methoden, die individuell an Ihr Kind angepasst werden. Dafür bieten wir flexible Sprechzeiten, um den Bedürfnissen unserer jungen Patientinnen und Patienten sowie Ihnen als Eltern gerecht zu werden. Termine können telefonisch oder online vereinbart werden. Zögern Sie nicht, uns zu kontaktieren – wir freuen uns darauf, Sie und Ihr Kind auf dem Weg zu gesunden Zähnen und einem strahlend schönen Lächeln zu begleiten.
